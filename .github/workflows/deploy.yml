# .github/workflows/deploy-production.yml
name: Deploy Laravel to Hostinger (Production)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            cd ${{ secrets.HOSTINGER_PRODUCTION_PATH }}
            
            # Put app into maintenance mode
            php artisan down || true
            
            # Fetch latest changes from master
            git fetch origin master
            git reset --hard origin/master
            
            # Install PHP dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Run database migrations
            # php artisan migrate --force
            
            # Clear and rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            # Ensure storage link exists
            php artisan storage:link || true
            
            # Bring app back online
            php artisan up